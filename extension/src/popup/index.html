<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YT2Text</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 320px;
        min-height: 180px;
        background: #0f0f0f;
        color: #e8e8e8;
        padding: 16px;
      }
      h1 { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #fff; }
      .btn {
        display: block;
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 12px;
      }
      .btn-primary { background: #cc0000; color: #fff; }
      .btn-secondary { background: #333; color: #e8e8e8; }
      .user-info { font-size: 12px; color: #aaa; margin-bottom: 8px; }
      .jobs-list { list-style: none; }
      .jobs-list li {
        font-size: 12px;
        padding: 6px 0;
        border-bottom: 1px solid #222;
        display: flex;
        justify-content: space-between;
      }
      .status-badge {
        border-radius: 3px;
        padding: 1px 6px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
      }
      .status-queued { background: #1a3a6e; color: #7ab4ff; }
      .status-done { background: #1a3a1a; color: #7dff7d; }
      .status-awaiting { background: #3a2a0a; color: #ffa500; }
      .status-failed { background: #3a0a0a; color: #ff7070; }
      .empty { color: #555; font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
